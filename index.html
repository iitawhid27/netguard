<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>NetGuard</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,html[data-theme=light]{--bg:#f4f6fb;--c:#fff;--bd:#e2e8f3;--t:#0f1b33;--d:#64748b;--a:#2f6bff;--b:#1b49e0;--ok:#0fb981;--r:#ef4444;--soft:rgba(15,27,51,.05);--nav:rgba(255,255,255,.92);--sheet:#fff;--hero:linear-gradient(160deg,#091a3f,#0f2a68 55%,#1d4fd8);--toast:#0f1b33;--g:linear-gradient(135deg,var(--a),var(--b));--sh:0 1px 2px rgba(16,24,40,.05),0 12px 28px -16px rgba(16,24,40,.18)}
html[data-theme=dark]{--bg:#0a0f1e;--c:#131a2d;--bd:rgba(255,255,255,.08);--t:#eaf0ff;--d:#94a3b8;--a:#4f8dff;--b:#2f6bff;--ok:#34d399;--r:#f87171;--soft:rgba(255,255,255,.07);--nav:rgba(19,26,45,.92);--sheet:#131a2d;--hero:linear-gradient(160deg,#0b1a3e,#12307a 55%,#1d4fd8);--toast:#1e2944;--sh:0 8px 24px -12px #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:'Inter','Hind Siliguri',system-ui,sans-serif;font-size:15px}
body{min-height:100vh}
@keyframes up{from{transform:translateY(40px);opacity:0}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--t);width:100%;background:var(--soft);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;outline:0;color-scheme:light dark}
input:focus,select:focus{border-color:var(--a);background:var(--c)}
select option{color:#000}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.3px}
.dot{width:36px;height:36px;border-radius:12px;background:var(--g);display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(29,79,216,.6)}.dot svg{width:18px;height:18px}
h2{font-size:22px;margin:0 0 4px;font-weight:700}.sub{color:var(--d);font-size:14px;margin:0 0 16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ds{color:var(--d);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--d)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--d)}.pill.ok{color:var(--ok);background:rgba(15,185,129,.12)}.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:22px;margin-bottom:12px;background:var(--hero);box-shadow:0 26px 50px -22px rgba(16,40,130,.6)}
.hero:before{content:"";position:absolute;right:-40px;top:-70px;width:230px;height:230px;background:radial-gradient(circle,rgba(94,200,255,.55),transparent 70%);opacity:.5}
.hero .ds{color:rgba(255,255,255,.7)}.hero b{display:block;font-size:40px;letter-spacing:-.02em;margin:4px 0}
.btn{padding:13px 18px;border-radius:14px;font-weight:600;background:var(--g);color:#fff;width:100%;height:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(29,79,216,.6)}
.btn.gh{background:var(--soft);color:var(--t);box-shadow:none}.btn.rd{background:rgba(239,68,68,.12);color:var(--r);box-shadow:none}
.btn[disabled]{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;padding:10px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--c);font-size:14px}
.chip.on{background:linear-gradient(160deg,#2f6bff,#1745d6);color:#fff;border-color:transparent;font-weight:600}
.ic{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.bar{height:6px;border-radius:6px;background:var(--soft);margin-top:12px}.bar div{height:6px;border-radius:6px;background:var(--g)}
.empty{text-align:center;color:var(--d);padding:38px 10px}.empty big{display:block;font-size:40px;margin-bottom:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(540px,calc(100% - 24px));display:flex;padding:6px;border-radius:24px;background:var(--nav);border:1px solid var(--bd);backdrop-filter:blur(20px);box-shadow:0 18px 40px -14px rgba(10,26,63,.45);z-index:5}
.nav button{flex:1;padding:9px 0 8px;border-radius:20px;font-size:11px;font-weight:500;color:var(--d);display:flex;flex-direction:column;align-items:center;gap:3px}.nav svg{width:22px;height:22px}
.nav button.on{background:linear-gradient(160deg,#2f6bff,#102c75);color:#fff;font-weight:700}
.fab{width:36px;height:36px;border-radius:12px;background:var(--g);color:#fff;font-size:17px;display:grid;place-items:center}
#bk{position:fixed;inset:0;background:rgba(15,27,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}#bk.open{display:flex}
#sheet{width:100%;max-width:560px;background:var(--sheet);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .25s;max-height:90vh;overflow:auto}
#sheet label,.lb{display:block;font-size:13px;color:var(--d);margin:12px 2px 6px}#sheet h3{margin:0 0 6px;font-size:20px}
.pw{position:relative}.pw button{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--toast);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:20;transition:.3s;max-width:92vw}#toast.show{transform:translate(-50%,0)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<div id="root"></div><div id="bk" onclick="if(event.target===this)closeM()"><div id="sheet"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='netguard_v2';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){S={routers:[],usage:{},dev:{}};try{const o=JSON.parse(localStorage.getItem('netguard_v1'));if(o&&o.routers){S.routers=o.routers.map(x=>({id:x.id,name:x.name,ip:x.ip,user:x.user,pass:x.pass,type:x.type||'',online:null}));S.active=o.active;S.theme=o.theme}}catch(e){}}
S.usage=S.usage||{};S.dev=S.dev||{};S.routers=S.routers||[];
let tab='dev',sel=null,busy=false,rf=null,rt=null,lastOk=0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.routers.find(r=>r.id===S.active)||S.routers[0];
const ymd=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(1)+' MB';
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const dname=m=>(S.dev[m]&&S.dev[m].name)||m;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),Math.max(2300,m.length*80))}
function modal(h){$('#sheet').innerHTML=h;$('#bk').classList.add('open')}
function closeM(){$('#bk').classList.remove('open')}
function md5(str){const u=unescape(encodeURIComponent(str)),K=[],S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
 for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
 const n=u.length,w=[];for(let i=0;i<n;i++)w[i>>2]|=u.charCodeAt(i)<<((i%4)*8);w[n>>2]|=0x80<<((n%4)*8);
 const len=(((n+8)>>6)+1)*16;for(let i=0;i<len;i++)w[i]=w[i]|0;w[len-2]=n*8;
 let a=0x67452301,b=0xefcdab89|0,c=0x98badcfe|0,d=0x10325476;
 for(let o=0;o<len;o+=16){let A=a,B=b,C=c,D=d;
  for(let i=0;i<64;i++){let f,g;const r=i>>4;
   if(r==0){f=(B&C)|(~B&D);g=i}else if(r==1){f=(D&B)|(~D&C);g=(5*i+1)%16}else if(r==2){f=B^C^D;g=(3*i+5)%16}else{f=C^(B|~D);g=(7*i)%16}
   const t=D;D=C;C=B;const x=(A+f+K[i]+w[o+g])|0,sh=S[(r<<2)|(i&3)];B=(B+((x<<sh)|(x>>>(32-sh))))|0;A=t}
  a=(a+A)|0;b=(b+B)|0;c=(c+C)|0;d=(d+D)|0}
 const h=v=>{let s='';for(let i=0;i<4;i++)s+=('0'+((v>>>(i*8))&255).toString(16)).slice(-2);return s};return h(a)+h(b)+h(c)+h(d)}
/* ---------- router access ---------- */
async function tReq(r,m,path,data,x){const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;if(!P)throw new Error('শুধু APK অ্যাপে কাজ করে');
 const h={'X-Requested-With':'XMLHttpRequest',Referer:'http://'+r.ip+'/index.html'};if(r.ck)h.Cookie=r.ck;
 if(data!=null)h['Content-Type']='application/x-www-form-urlencoded; charset=UTF-8';
 const o=Object.assign({url:'http://'+r.ip+path,headers:h,connectTimeout:6000,readTimeout:8000},x||{});if(data!=null)o.data=data;return P[m](o)}
const jd=x=>{let d=x&&x.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){}}return d};
async function tLogin(r){let tok='';
 try{const g=await tReq(r,'get','/goform/getstok?random='+Math.random(),null),m=/[0-9a-f]{16,}/i.exec(typeof g.data==='string'?g.data:JSON.stringify(g.data));if(m)tok=m[0]}catch(e){}
 const pw=tok?md5(btoa(r.pass)+tok):md5(r.pass);
 const x=await tReq(r,'post','/login/Auth','username='+encodeURIComponent(r.user||'admin')+'&password='+pw,{disableRedirects:true});
 const m=/(ecos_pw|password)=([^;,"\s\\]+)/i.exec(JSON.stringify(x.headers||{}));
 if(!m)throw new Error('লগইন হয়নি — এডমিন পাসওয়ার্ড ঠিক আছে?');r.ck=m[1]+'='+m[2]}
async function aReq(r,m,path,data,x){const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;if(!P)throw new Error('শুধু APK অ্যাপে কাজ করে');
 const h={'User-Agent':'asusrouter--DUTUtil-',Referer:'http://'+r.ip+'/Main_Login.asp'};if(r.ck)h.Cookie=r.ck;
 if(data!=null)h['Content-Type']='application/x-www-form-urlencoded';
 const o=Object.assign({url:'http://'+r.ip+path,headers:h,connectTimeout:6000,readTimeout:10000},x||{});if(data!=null)o.data=data;return P[m](o)}
async function aLogin(r){const x=await aReq(r,'post','/login.cgi','group_id=&action_mode=&action_script=&action_wait=5&current_page=Main_Login.asp&next_page=index.asp&login_authorization='+encodeURIComponent(btoa((r.user||'admin')+':'+r.pass)),{disableRedirects:true});
 const t=JSON.stringify(x.headers||{})+(typeof x.data==='string'?x.data:JSON.stringify(x.data||'')),m=/asus_token["'=:\s]+["']?([A-Za-z0-9]{8,})/.exec(t);
 if(!m)throw new Error('লগইন হয়নি — ইউজারনেম/পাসওয়ার্ড ঠিক আছে? (ASUS-এ সাধারণত admin / admin)');r.ck='asus_token='+m[1]}
async function hget(url,ms){try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
 if(P){return await P.get({url,disableRedirects:true,connectTimeout:ms,readTimeout:ms})}
 const c=new AbortController();setTimeout(()=>c.abort(),ms);await fetch(url,{mode:'no-cors',signal:c.signal});return{status:0}}catch(e){return null}}
const GW=['192.168.0.1','192.168.1.1','192.168.10.1','192.168.31.1','192.168.100.1','192.168.2.1','192.168.3.1','192.168.8.1','10.0.0.1','10.0.1.1','192.168.50.1','192.168.0.254','192.168.1.254','192.168.123.1','192.168.4.1','192.168.5.1','192.168.20.1','192.168.18.1','192.168.88.1','192.168.15.1','192.168.11.1','10.10.10.1'];
async function findGw(){const ck=async(ip,ms)=>(await hget('http://'+ip,ms))?ip:null;let l=(await Promise.all(GW.map(ip=>ck(ip,2000)))).filter(Boolean);
 if(!l.length){const ips=[];for(let n=0;n<256;n++){const ip='192.168.'+n+'.1';if(!GW.includes(ip))ips.push(ip)}
  for(let i=0;i<ips.length&&!l.length;i+=64)l=(await Promise.all(ips.slice(i,i+64).map(ip=>ck(ip,1500)))).filter(Boolean)}
 return l}
async function detect(r){const pick=t=>/tenda/.test(t)?'tenda':/asus/.test(t)?'asus':/tp-?link|tplink/.test(t)?'tplink':'';
 const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;if(!P)return '';
 for(const p of ['/','/Main_Login.asp'])for(const dr of [true,false]){try{const x=await P.get({url:'http://'+r.ip+p,disableRedirects:dr,connectTimeout:3500,readTimeout:3500});
  const k=pick(((typeof x.data==='string'?x.data:'')+JSON.stringify(x.headers||{})+(x.url||'')).toLowerCase());if(k)return k}catch(e){}}return ''}
/* ---------- router setup ---------- */
function setupForm(){const r=cur()||{};modal(`<h3>রাউটার সেটিংস</h3><button class="btn gh" style="margin-top:8px" onclick="autoFind()">⟳ রাউটার নিজে খুঁজুন</button><label>রাউটার IP</label><input id="ri" inputmode="decimal" placeholder="192.168.50.1" value="${esc(r.ip||'')}"><label>ইউজারনেম</label><input id="ru" placeholder="admin" autocapitalize="off" value="${esc(r.user||'')}"><label>পাসওয়ার্ড</label><div class="pw"><input id="rp" type="password" value="${esc(r.pass||'')}"><button onclick="const i=$('#rp');i.type=i.type=='password'?'text':'password'">👁</button></div><label>রাউটারের ব্র্যান্ড</label><select id="rb"><option value="">স্বয়ংক্রিয়</option>${[['asus','ASUS'],['tenda','Tenda'],['tplink','TP-Link']].map(b=>`<option value="${b[0]}" ${r.type===b[0]?'selected':''}>${b[1]}</option>`).join('')}</select><div style="height:18px"></div><button class="btn" onclick="saveRouter()">সেভ করুন</button>`)}
async function autoFind(){toast('রাউটার খোঁজা হচ্ছে…');const l=await findGw();if(!l.length)return toast('রাউটার পাওয়া যায়নি, IP নিজে লিখুন');
 $('#ri').value=l[0];const t=await detect({ip:l[0]});if(t)$('#rb').value=t;toast('পাওয়া গেছে: '+l[0])}
async function saveRouter(){const ip=$('#ri').value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'');if(!ip)return toast('রাউটারের IP দিন');
 let r=cur();if(!r){r={id:uid(),name:'আমার রাউটার',type:''};S.routers.push(r);S.active=r.id}
 if(r.ip!==ip){r.pv=null;r.on=[]}
 r.ip=ip;r.user=$('#ru').value.trim();r.pass=$('#rp').value;r.ck='';r.type=$('#rb').value||'';r.err='';save();closeM();render();
 if(!r.type){toast('ব্র্যান্ড চেনা হচ্ছে…');r.type=await detect(r);save()}
 render();sample()}
/* ---------- usage tracking ---------- */
async function raw(r){const login=r.type==='asus'?aLogin:tLogin;
 const get=async()=>{if(r.type==='asus'){const x=await aReq(r,'get','/appGet.cgi?hook=get_clientlist()',null),c=(jd(x)||{}).get_clientlist;if(!c||typeof c!=='object')throw new Error('ডিভাইস তালিকা পড়া যায়নি: '+String(x.data).slice(0,90));
   return Object.keys(c).filter(k=>k.length===17&&c[k]&&c[k].isOnline==='1').map(k=>Object.assign({},c[k],{mac:k.toUpperCase(),nm:c[k].nickName||c[k].name||''}))}
  let x=await tReq(r,'get','/goform/getOnlineList?random='+Math.random(),null),j=jd(x);if(!Array.isArray(j)){x=await tReq(r,'get','/goform/getQos?random='+Math.random()+'&modules=onlineList',null);j=jd(x);j=j&&j.onlineList}
  if(!Array.isArray(j))throw new Error('ডিভাইস তালিকা পড়া যায়নি: '+String(x.data).slice(0,90));
  return j.map(o=>Object.assign({},o,{mac:String(o.qosListMAC||o.mac||o.MAC||o.macAddr||'').toUpperCase().replace(/-/g,':'),nm:o.qosListRemark||o.qosListHostname||o.hostName||o.devName||o.name||'',ip:o.qosListIP||o.ip||o.IP||o.ipAddr||''}))};
 try{if(!r.ck)await login(r);return await get()}catch(e){r.ck='';await login(r);return await get()}}
function bytesOf(r,o,now){const ks=Object.keys(o);
 if(r.type==='tenda'){const u=ks.find(k=>/up.*speed|speed.*up/i.test(k)),d=ks.find(k=>/down.*speed|speed.*down/i.test(k));if(!u&&!d)return null;
  const dt=r.lt?Math.min(30,(now-r.lt)/1000):0;return(num(o[u])+num(o[d]))*1024*dt}
 const rx=ks.find(k=>/^totalrx$/i.test(k)),tx=ks.find(k=>/^totaltx$/i.test(k));if(!rx&&!tx)return null;
 const c=num(o[rx])+num(o[tx]),p=(r.pv||{})[o.mac];r.nv[o.mac]=c;return p==null||c<p?0:c-p}
async function sample(){const r=cur();if(!r||!r.pass||!r.type||busy||document.hidden)return;busy=true;
 try{const l=await raw(r),now=Date.now(),k=ymd(now),U=S.usage[r.id]=S.usage[r.id]||{},D=U[k]=U[k]||{};let any=false;r.nv={};r.on=[];
  l.forEach(o=>{if(!o.mac)return;r.on.push(o.mac);const d=S.dev[o.mac]=S.dev[o.mac]||{};if(o.ip)d.ip=o.ip;if(!d.custom&&o.nm)d.name=o.nm;
   const b=bytesOf(r,o,now);if(b!=null){any=true;if(b>0)D[o.mac]=(D[o.mac]||0)+b}});
  r.pv=r.nv;r.lt=now;r.err='';r.hasUse=any;r.online=true;lastOk=now;
  Object.keys(U).sort().slice(0,-400).forEach(x=>delete U[x])}
 catch(e){r.err=e.message}
 busy=false;save();if(!$('#bk').classList.contains('open')&&tab!=='rep')render()}
function renameDev(m){const d=S.dev[m]||{};modal(`<h3>নাম বদলান</h3><div class="ds">${esc(m)}</div><label>নাম</label><input id="rnm" value="${esc(d.name||'')}"><div style="height:18px"></div><button class="btn" onclick="saveName('${m}')">সেভ করুন</button>`)}
function saveName(m){const v=$('#rnm').value.trim();S.dev[m]=S.dev[m]||{};if(v){S.dev[m].name=v;S.dev[m].custom=true}save();closeM();render()}
function setDay(k){sel=k;render()}
function pickDay(v){if(v){sel=v;render()}}
function go(t){tab=t;render();scrollTo(0,0)}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';save();render()}
/* ---------- views ---------- */
function gate(r){
 if(!r.pass||!r.ip)return `<div class="card"><div class="nm">রাউটারে লগইন দিন</div><p class="ds">ডিভাইসের হিসাব রাখতে রাউটারের এডমিন ইউজারনেম ও পাসওয়ার্ড লাগবে।</p><button class="btn" onclick="setupForm()">রাউটার সেটিংস</button></div>`;
 if(!r.type)return `<div class="card"><div class="nm">রাউটারের ধরন চেনা যায়নি</div><p class="ds">সেটিংসে গিয়ে ব্র্যান্ড বেছে নিন।</p><button class="btn" onclick="setupForm()">ব্র্যান্ড বাছুন</button></div>`;
 return ''}
const warn=r=>(r.hasUse===false?`<div class="card"><div class="nm" style="color:var(--r)">এই রাউটার ডিভাইস-ভিত্তিক ডেটা দিচ্ছে না</div><p class="ds">তাই ব্যবহারের হিসাব রাখা যাচ্ছে না।</p></div>`:'')+(r.err?`<div class="card ds" style="color:var(--r)">${esc(r.err)}</div>`:'');
function devCard(m,bytes,mx,on,showIp){const d=S.dev[m]||{};return `<div class="card"><div class="row"><div class="ic">${on===false?'💤':'📱'}</div><div class="sp"><div class="nm" onclick="renameDev('${m}')">${esc(d.name||m)} ✎</div><div class="ds">${esc((showIp&&d.ip?d.ip+' · ':'')+m)}</div></div><div style="text-align:right">${on===true?'<span class="pill ok"><i></i>কানেক্টেড</span>':''}<b style="font-size:17px;display:block;${on===true?'margin-top:4px':''}">${fmt(bytes)}</b></div></div><div class="bar"><div style="width:${Math.max(2,mx?bytes/mx*100:0)}%"></div></div></div>`}
function vDev(r){const g=gate(r);if(g)return g;
 const T=(S.usage[r.id]||{})[ymd(Date.now())]||{},on=r.on||[],all=Array.from(new Set(on.concat(Object.keys(T))));
 all.sort((a,b)=>(on.includes(b)-on.includes(a))||((T[b]||0)-(T[a]||0)));const mx=Math.max(1,...all.map(m=>T[m]||0));
 return `<h2>কানেক্টেড ডিভাইস</h2><p class="sub">নাম চাপলে এডিট করা যাবে</p>${warn(r)}
 <div class="hero"><div class="ds">এখন কানেক্টেড</div><b>${on.length} টি</b><div class="ds">আজ মোট ${fmt(Object.values(T).reduce((a,b)=>a+b,0))}${lastOk?' · আপডেট '+new Date(lastOk).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'}):''}</div></div>
 ${all.length?all.map(m=>devCard(m,T[m]||0,mx,on.includes(m),true)).join(''):`<div class="empty"><big>📡</big>ডিভাইস খোঁজা হচ্ছে…</div>`}
 <div class="ds" style="margin:8px 4px">${r.type==='tenda'?'Tenda-র ক্ষেত্রে হিসাব শুধু অ্যাপ খোলা থাকলে চলে।':'হিসাব রাউটারের কাউন্টার থেকে নেওয়া হয়; অ্যাপ খোলা থাকলে আপডেট হয়।'}</div>`}
function range(){const r=cur(),a=rf||ymd(Date.now()),b=rt||ymd(Date.now());
 const U=S.usage[r.id]||{},dev={},days=[];let tot=0;
 Object.keys(U).sort().filter(d=>d>=a&&d<=b).forEach(d=>{let s=0,n=0;for(const m in U[d]){const v=U[d][m];if(v>0){s+=v;n++;dev[m]=dev[m]||{b:0,d:0};dev[m].b+=v;dev[m].d++}}days.push({d,s,n});tot+=s});
 return {a,b,dev:Object.keys(dev).map(m=>({m,b:dev[m].b,d:dev[m].d})).sort((x,y)=>y.b-x.b),days,tot}}
let rp='today';
function preset(p){rp=p;const n=new Date(),t=ymd(Date.now());let a=t;if(p==='week')a=ymd(Date.now()-6*864e5);if(p==='month')a=ymd(new Date(n.getFullYear(),n.getMonth(),1).getTime());if(p==='year')a=ymd(new Date(n.getFullYear(),0,1).getTime());rf=a;rt=t;render()}
function vRep(r){const g=gate(r);if(g)return g;const R=range(),mx=R.dev[0]?R.dev[0].b:1,P=[['today','আজ'],['week','৭ দিন'],['month','এই মাস'],['year','এই বছর']];
 return `<h2>কে কত জিবি ইউজ করেছে</h2><p class="sub">সময় বা তারিখ বেছে নিন, তারপর PDF করুন</p>
 <div class="chips">${P.map(p=>`<button class="chip ${rp===p[0]?'on':''}" onclick="preset('${p[0]}')">${p[1]}</button>`).join('')}</div>
 <div class="two"><div><label class="lb" style="margin-top:0">থেকে</label><input type="date" value="${R.a}" onchange="rp='custom';rf=this.value;render()"></div><div><label class="lb" style="margin-top:0">পর্যন্ত</label><input type="date" value="${R.b}" onchange="rp='custom';rt=this.value;render()"></div></div>
 ${warn(r)}<div class="hero" style="margin-top:14px"><div class="ds">${R.a===R.b?R.a:R.a+' → '+R.b} · মোট ইউজ</div><b>${fmt(R.tot)}</b><div class="ds">${R.dev.length} টি ডিভাইস · ${R.days.length} দিনের হিসাব</div></div>
 ${R.dev.length?R.dev.map(e=>devCard(e.m,e.b,mx,null,false)).join(''):`<div class="empty"><big>📊</big>এই সময়ের কোনো হিসাব নেই</div>`}
 <button class="btn" id="pdfb" onclick="makePdf()" ${R.dev.length?'':'disabled'}>📄 PDF বানান</button>`}
function render(){const root=$('#root'),r=cur();document.documentElement.dataset.theme=S.theme==='dark'?'dark':'light';
 const top=`<div class="top"><div class="brand"><div class="dot"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></div>NetGuard</div><div class="row" style="gap:8px"><button class="fab" onclick="setupForm()">⚙</button><button class="fab" onclick="toggleTheme()">${S.theme==='dark'?'☀':'☾'}</button></div></div>`;
 if(!r){root.innerHTML=`<div class="app">${top}<div class="empty"><big>📡</big>রাউটার যোগ করা হয়নি</div><button class="btn" onclick="setupForm()">রাউটার যোগ করুন</button></div>`;return}
 const IC={dev:`<path d="M5 3h14v18H5zM11 18h2"/>`,day:`<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>`,rep:`<path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h7M9 17h7"/>`};
 const V=tab==='rep'?vRep(r):vDev(r);
 const act=document.activeElement;if(act&&act.tagName==='INPUT'&&act.type!=='date'&&root.contains(act))return;
 root.innerHTML=`<div class="app">${top}${V}</div><div class="nav">${[['dev','ডিভাইস'],['rep','ব্যবহার']].map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n[0]]}</svg>${n[1]}</button>`).join('')}</div>`}
/* ---------- PDF (no libraries: pages drawn on canvas, embedded as JPEG) ---------- */
function pdfFrom(cs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length},n=cs.length;
 push('%PDF-1.4\n');offs[1]=len;push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
 offs[2]=len;push('2 0 obj\n<</Type/Pages/Count '+n+'/Kids['+cs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>\nendobj\n');
 cs.forEach((c,i)=>{const p=3+3*i,bin=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),jb=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)jb[j]=bin.charCodeAt(j);
  offs[p]=len;push(p+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>\nendobj\n');
  const cn='q 595 0 0 842 0 0 cm /Im0 Do Q';offs[p+1]=len;push((p+1)+' 0 obj\n<</Length '+cn.length+'>>\nstream\n'+cn+'\nendstream\nendobj\n');
  offs[p+2]=len;push((p+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jb.length+'>>\nstream\n');push(jb);push('\nendstream\nendobj\n')});
 const xo=len,tot=3+3*n;push('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push('trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
async function makePdf(){const btn=$('#pdfb');btn.disabled=true;btn.textContent='তৈরি হচ্ছে…';
 try{const R=range(),r=cur();try{await Promise.all([document.fonts.load('600 14px "Hind Siliguri"'),document.fonts.load('700 14px "Hind Siliguri"'),document.fonts.load('400 14px "Hind Siliguri"')])}catch(e){}
  const W=595,H=842,M=36,F='"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif',pages=[];let x,y;
  const np=()=>{const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;x=cv.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,W,H);pages.push(cv);y=M};
  const tx=(t,px,py,o)=>{o=o||{};x.font=(o.w||400)+' '+(o.s||11)+'px '+F;x.fillStyle=o.c||'#0f1b33';x.textAlign=o.a||'left';x.textBaseline='middle';t=String(t);
   if(o.mw){while(t.length>1&&x.measureText(t).width>o.mw)t=t.slice(0,-1);}x.fillText(t,px,py)};
  const hdr=cols=>{x.fillStyle='#1b49e0';x.fillRect(M,y,W-2*M,24);cols.forEach(c=>tx(c[0],c[1],y+12.5,{w:600,c:'#fff',a:c[2]}));y+=24};
  const rows=(cols,data,fn)=>{hdr(cols);data.forEach((d,i)=>{if(y>H-M-30){np();hdr(cols)}if(i%2){x.fillStyle='#f1f5fb';x.fillRect(M,y,W-2*M,22)}fn(d,y+11.5);y+=22});};
  np();tx('NetGuard — ডেটা ব্যবহার রিপোর্ট',M,y+14,{w:700,s:20});y+=34;
  tx('রাউটার: '+(r.name||'')+' ('+r.ip+')',M,y+8,{c:'#64748b'});y+=18;tx('সময়কাল: '+R.a+' থেকে '+R.b,M,y+8,{c:'#64748b'});y+=18;
  tx('তৈরির সময়: '+new Date().toLocaleString('en-GB'),M,y+8,{c:'#64748b'});y+=26;
  x.fillStyle='#eef3ff';x.fillRect(M,y,W-2*M,56);tx('মোট ব্যবহার',M+16,y+17,{c:'#64748b'});tx(fmt(R.tot),M+16,y+38,{w:700,s:22,c:'#1b49e0'});
  tx(R.dev.length+' টি ডিভাইস · '+R.days.length+' দিন',W-M-16,y+28,{a:'right',c:'#64748b'});y+=76;
  tx('ডিভাইস অনুযায়ী',M,y+8,{w:700,s:14});y+=22;
  rows([['ডিভাইস',M+8],['MAC',260],['সক্রিয় দিন',430,'right'],['মোট',W-M-8,'right']],R.dev,(e,cy)=>{tx(dname(e.m),M+8,cy,{mw:200});tx(e.m,260,cy,{s:9.5,c:'#64748b'});tx(e.d,430,cy,{a:'right'});tx(fmt(e.b),W-M-8,cy,{a:'right',w:600})});
  y+=18;if(y>H-M-80)np();tx('দিন অনুযায়ী',M,y+8,{w:700,s:14});y+=22;
  rows([['তারিখ',M+8],['ডিভাইস',300,'right'],['মোট',W-M-8,'right']],R.days,(e,cy)=>{tx(e.d,M+8,cy);tx(e.n,300,cy,{a:'right'});tx(fmt(e.s),W-M-8,cy,{a:'right',w:600})});
  pages.forEach((cv,i)=>{const c=cv.getContext('2d');c.font='400 9px '+F;c.fillStyle='#94a3b8';c.textAlign='center';c.fillText('পৃষ্ঠা '+(i+1)+' / '+pages.length,W/2,H-16)});
  await deliver(pdfFrom(pages),'NetGuard-'+R.a+'_'+R.b+'.pdf')}
 catch(e){toast('PDF হয়নি: '+e.message)}
 const b=$('#pdfb');if(b){b.disabled=false;b.textContent='📄 PDF বানান'}}
async function deliver(blob,name){const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){const b64=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.onerror=no;f.readAsDataURL(blob)});
  await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});const u=await P.Filesystem.getUri({path:name,directory:'CACHE'});
  await P.Share.share({title:name,url:u.uri,dialogTitle:'রিপোর্ট সেভ/শেয়ার করুন'});return}
 const f=new File([blob],name,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('PDF ডাউনলোড হচ্ছে: '+name)}
render();sample();setInterval(sample,5000);
document.addEventListener('visibilitychange',()=>{S.routers.forEach(x=>x.lt=0);if(!document.hidden)sample()});
