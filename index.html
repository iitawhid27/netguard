<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>NetGuard</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--c:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--t:#eef2ff;--d:#8d98b8;--a:#2de2c0;--b:#8b7bff;--r:#ff5d7a;--w:#ffb454;--g:linear-gradient(135deg,var(--a),var(--b))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:'Hind Siliguri',system-ui,sans-serif}
body{min-height:100vh;background-image:radial-gradient(600px 400px at 90% -5%,rgba(139,123,255,.22),transparent),radial-gradient(500px 380px at -10% 20%,rgba(45,226,192,.14),transparent);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--t);width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;outline:0}
input:focus,select:focus{border-color:var(--a)}
select option{color:#000}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.3px}
.dot{width:34px;height:34px;border-radius:11px;background:var(--g);display:grid;place-items:center;color:#06101a;font-size:17px}
h2{font-size:22px;margin:0 0 4px}.sub{color:var(--d);font-size:14px;margin:0 0 16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ds{color:var(--d);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--d)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--d)}.pill.ok{color:var(--a)}.pill.ok i{background:var(--a);box-shadow:0 0 10px var(--a)}.pill.bad{color:var(--r)}.pill.bad i{background:var(--r)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;margin-bottom:12px;background:linear-gradient(145deg,rgba(45,226,192,.16),rgba(139,123,255,.2));border:1px solid var(--bd)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--g);opacity:.18;filter:blur(30px)}
.ring{--p:0;width:112px;height:112px;border-radius:50%;flex:none;background:conic-gradient(var(--a) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center}
.ring div{width:88px;height:88px;border-radius:50%;background:#0c1220;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:'Space Grotesk',sans-serif;font-size:28px;display:block}.ring span{font-size:11px;color:var(--d)}
.btn{padding:13px 18px;border-radius:14px;font-weight:600;background:var(--g);color:#06101a;width:100%}
.btn.gh{background:rgba(255,255,255,.07);color:var(--t)}.btn.rd{background:rgba(255,93,122,.15);color:var(--r)}.btn.sm{width:auto;padding:9px 14px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:14px}
.st b{display:block;font-family:'Space Grotesk',sans-serif;font-size:28px;line-height:1.1}.st span{font-size:13px;color:var(--d)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;padding:10px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--c);font-size:14px}
.chip.on{background:var(--g);color:#06101a;border-color:transparent;font-weight:600}
.sw{width:48px;height:28px;border-radius:99px;background:#283049;position:relative;flex:none;transition:.25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{background:var(--g)}.sw.on:after{transform:translateX(20px)}.sw.red.on{background:var(--r)}
.ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:20px;flex:none}
.sec{font-size:13px;color:var(--d);margin:18px 4px 8px;letter-spacing:.4px}
.list .row{padding:12px 4px;border-bottom:1px solid var(--bd)}.list .row:last-child{border:0}
.empty{text-align:center;color:var(--d);padding:38px 10px}.empty big{display:block;font-size:40px;margin-bottom:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(540px,calc(100% - 24px));display:flex;padding:6px;border-radius:26px;background:rgba(14,20,36,.88);border:1px solid var(--bd);backdrop-filter:blur(20px);box-shadow:0 20px 40px -10px #000;z-index:5}
.nav button{flex:1;padding:8px 0;border-radius:20px;font-size:11px;color:var(--d);display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:19px}
.nav button.on{background:var(--g);color:#06101a;font-weight:700}
.fab{width:40px;height:40px;border-radius:14px;background:var(--g);color:#06101a;font-size:22px;font-weight:700}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
#bk.open{display:flex}
#sheet{width:100%;max-width:560px;background:#0e1424;border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet label{display:block;font-size:13px;color:var(--d);margin:12px 2px 6px}#sheet h3{margin:0 0 6px;font-size:20px}
.pw{position:relative}.pw button{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:#1b2440;border:1px solid var(--bd);padding:11px 18px;border-radius:14px;font-size:14px;z-index:20;transition:.3s}#toast.show{transform:translate(-50%,0)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px}
.login .dot{width:64px;height:64px;border-radius:20px;font-size:30px;margin-bottom:18px}

body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 30% 20%,rgba(45,226,192,.24),transparent),radial-gradient(38% 32% at 82% 72%,rgba(139,123,255,.28),transparent);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(5%,4%) scale(1.12)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.45;transform:translate(-50%,-50%) scale(.8)}}
.hero{box-shadow:0 0 70px -18px rgba(45,226,192,.5),inset 0 0 40px rgba(139,123,255,.12);border-color:rgba(45,226,192,.3)}
.radar{position:relative;width:100%;max-width:250px;aspect-ratio:1;margin:14px auto}
.rg{position:absolute;border-radius:50%;border:1px solid rgba(45,226,192,.28);box-shadow:inset 0 0 22px rgba(45,226,192,.08)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 280deg,rgba(45,226,192,.55) 360deg);animation:spin 3.6s linear infinite}
.core{position:absolute;inset:34%;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#0f1b30,#080d19);border:1px solid rgba(45,226,192,.5);box-shadow:0 0 34px rgba(45,226,192,.55)}
.core b{font-family:'Space Grotesk',sans-serif;font-size:30px;line-height:1;text-shadow:0 0 16px var(--a)}.core span{font-size:11px;color:var(--d)}
.nd{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--a);box-shadow:0 0 14px var(--a);transform:translate(-50%,-50%);animation:blink 2.4s infinite}
.nd.bk{background:var(--r);box-shadow:0 0 14px var(--r)}.nd.lm{background:var(--w);box-shadow:0 0 14px var(--w)}
.lg{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--d);margin-bottom:14px}.lg i{position:static;display:inline-block;transform:none;animation:none;width:8px;height:8px;margin-right:5px}
.hero.off .sweep{animation-play-state:paused;opacity:.25}.hero.off .core{border-color:var(--r);box-shadow:0 0 34px rgba(255,93,122,.55)}.hero.off .core b{text-shadow:0 0 16px var(--r);color:var(--r)}
.st{position:relative;overflow:hidden}.st:before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:2px;background:var(--g);box-shadow:0 0 14px var(--a)}.st b{text-shadow:0 0 20px currentColor}
.chip.on{box-shadow:0 0 20px rgba(45,226,192,.55)}.sw.on{box-shadow:0 0 14px rgba(45,226,192,.6)}.sw.red.on{box-shadow:0 0 14px rgba(255,93,122,.6)}
.nav button.on{box-shadow:0 0 22px rgba(45,226,192,.5)}.btn:not(.gh):not(.rd){box-shadow:0 8px 26px -8px rgba(45,226,192,.7)}.brand .dot{box-shadow:0 0 22px rgba(45,226,192,.6)}
</style></head><body>
<div id="root"></div><div id="bk" onclick="if(event.target===this)closeM()"><div id="sheet"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='netguard_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{routers:[],active:null};let tab='home';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.routers.find(r=>r.id===S.active);
const sw=(on,fn,red)=>`<button class="sw ${on?'on':''} ${red?'red':''}" onclick="${fn}"></button>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
function modal(h){$('#sheet').innerHTML=h;$('#bk').classList.add('open')}
function closeM(){$('#bk').classList.remove('open')}
const CAT=[['সোশ্যাল মিডিয়া',[['tiktok','TikTok','🎵'],['instagram','Instagram','📸'],['facebook','Facebook','👍'],['youtube','YouTube','▶️'],['snapchat','Snapchat','👻'],['x','X (Twitter)','✖️']]],
['১৮+ ও ঝুঁকিপূর্ণ',[['adult','১৮+ ভিডিও ও সাইট','🔞'],['gambling','জুয়া ও বেটিং','🎰'],['proxy','প্রক্সি ও ভিপিএন সাইট','🛡️']]],
['গেম ও স্ট্রিমিং',[['games','অনলাইন গেম','🎮'],['netflix','Netflix','🎬']]]];
const QUICK=[['adult','🔞 ১৮+'],['tiktok','🎵 TikTok'],['instagram','📸 Instagram'],['facebook','👍 Facebook'],['youtube','▶️ YouTube']];

/* ---------- router ---------- */
async function ping(ip){return !!(await hget('http://'+ip,4000))}
async function test(id){const r=S.routers.find(x=>x.id===id);if(!r)return;r.online=null;render();
 r.online=await ping(r.ip);save();render();toast(r.online?'রাউটার পাওয়া গেছে':'রাউটারে পৌঁছানো যাচ্ছে না')}
function routerForm(first){return `<label>রাউটারের নাম</label><input id="rn" placeholder="যেমন: বাসার রাউটার">
<label>রাউটার IP</label><input id="ri" inputmode="decimal" placeholder="192.168.0.1" value="${first?'192.168.0.1':''}">
<label>ইউজারনেম</label><input id="ru" placeholder="admin" autocapitalize="off">
<label>পাসওয়ার্ড</label><div class="pw"><input id="rp" type="password" placeholder="রাউটার লগইন পাসওয়ার্ড"><button onclick="const i=$('#rp');i.type=i.type=='password'?'text':'password'">👁</button></div>
<div style="height:18px"></div><button class="btn" onclick="addRouter()">সংযোগ করুন</button>`}
function addRouter(){const ip=$('#ri').value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,''),u=$('#ru').value.trim(),p=$('#rp').value;
 if(!ip)return toast('রাউটারের IP দিন');
 const r={id:uid(),name:$('#rn').value.trim()||'আমার রাউটার',ip,user:u,pass:p,online:null,devices:[],blocks:{},custom:[],vpns:[],vpnBlock:false,paused:false};
 S.routers.push(r);S.active=r.id;tab='home';save();closeM();render();test(r.id)}
function delRouter(id){if(!confirm('এই রাউটার মুছবেন?'))return;S.routers=S.routers.filter(r=>r.id!==id);if(S.active===id)S.active=S.routers[0]?.id||null;save();render()}
function setActive(id){S.active=id;save();render()}

/* ---------- actions ---------- */
function setPaused(){const r=cur();r.paused=!r.paused;save();render()}
function setBlock(k){const r=cur();r.blocks[k]=!r.blocks[k];save();render()}
function addDev(){const n=$('#dn').value.trim(),m=$('#dm').value.trim();if(!n||!m)return toast('নাম ও MAC/IP দিন');
 cur().devices.push({id:uid(),name:n,addr:m,blocked:false,limit:0});save();closeM();render()}
function devBlock(id){const d=cur().devices.find(x=>x.id===id);d.blocked=!d.blocked;save();render()}
function devLimit(id,v){cur().devices.find(x=>x.id===id).limit=+v;save();render()}
function delDev(id){const r=cur();r.devices=r.devices.filter(x=>x.id!==id);save();render()}
function addCustom(){const i=$('#cd'),v=i.value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');if(!v)return;
 const r=cur();if(!r.custom.includes(v))r.custom.push(v);save();render()}
function delCustom(v){const r=cur();r.custom=r.custom.filter(x=>x!==v);save();render()}
function vpnBlock(){const r=cur();r.vpnBlock=!r.vpnBlock;save();render()}
function addVpn(){const n=$('#vn').value.trim(),s=$('#vs').value.trim();if(!n||!s)return toast('নাম ও সার্ভার দিন');
 cur().vpns.push({id:uid(),name:n,server:s,on:false});save();closeM();render()}
function vpnOn(id){const r=cur();r.vpns.forEach(v=>v.on=v.id===id?!v.on:false);save();render()}
function delVpn(id){const r=cur();r.vpns=r.vpns.filter(v=>v.id!==id);save();render()}
const GW=['192.168.0.1','192.168.1.1','192.168.10.1','192.168.31.1','192.168.100.1','192.168.2.1','192.168.3.1','192.168.8.1','10.0.0.1','10.0.1.1'];
async function hget(url,ms){try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
 if(P){return await P.get({url,connectTimeout:ms,readTimeout:ms})}
 const c=new AbortController();setTimeout(()=>c.abort(),ms);await fetch(url,{mode:'no-cors',signal:c.signal});return{status:0}}catch(e){return null}}
async function findGw(){return(await Promise.all(GW.map(async ip=>(await hget('http://'+ip,1500))?ip:null))).filter(Boolean)}
function autoIp(){findGw().then(l=>{const i=$('#ri');if(i&&l[0]){i.value=l[0];toast('রাউটার পাওয়া গেছে: '+l[0])}})}
let searching=false,failed=false;
const mk=(ip,name)=>({id:uid(),name,ip,user:'',pass:'',online:true,devices:[],blocks:{},custom:[],vpns:[],vpnBlock:false,paused:false});
function searchView(){return `<div class="login" style="text-align:center"><div class="radar" style="max-width:200px"><i class="rg" style="inset:0"></i><i class="rg" style="inset:25%"></i><div class="sweep" ${failed?'style="animation:none;opacity:.2"':''}></div><div class="core" style="inset:34%"><b style="font-size:24px">⚡</b></div></div>
<h2>${failed?'রাউটার পাওয়া যায়নি':'রাউটার খোঁজা হচ্ছে…'}</h2><p class="sub">${failed?'ফোন রাউটারের Wi-Fi তে আছে কিনা দেখুন':'একটু অপেক্ষা করুন'}</p>
${failed?`<button class="btn" onclick="autoAdd()">আবার খুঁজুন</button><div style="height:10px"></div><button class="btn gh" onclick="modal('<h3>নতুন রাউটার</h3>'+routerForm(0))">নিজে যোগ করুন</button>`:''}</div>`}
async function autoAdd(){searching=true;failed=false;render();const l=await findGw();searching=false;
 if(!l.length){failed=true;render();return}
 l.forEach((ip,i)=>{if(!S.routers.some(x=>x.ip===ip))S.routers.push(mk(ip,i?'রাউটার '+(i+1):'আমার রাউটার'))});
 if(!cur())S.active=S.routers[0].id;save();render()}
async function findMore(){toast('খোঁজা হচ্ছে…');const l=await findGw();let n=0;
 l.forEach(ip=>{if(!S.routers.some(x=>x.ip===ip)){S.routers.push(mk(ip,'রাউটার '+(S.routers.length+1)));n++}});save();render();toast(n?n+'টি নতুন রাউটার পাওয়া গেছে':'নতুন রাউটার পাওয়া যায়নি')}
function credForm(id){const r=S.routers.find(x=>x.id===id);modal(`<h3>এডমিন লগইন</h3><label>ইউজারনেম</label><input id="cu" value="${esc(r.user)}" placeholder="admin" autocapitalize="off"><label>পাসওয়ার্ড</label><div class="pw"><input id="cp" type="password" value="${esc(r.pass)}" placeholder="রাউটারের এডমিন পাসওয়ার্ড"><button onclick="const i=$('#cp');i.type=i.type=='password'?'text':'password'">👁</button></div><div style="height:18px"></div><button class="btn" onclick="saveCred('${id}')">সেভ করুন</button>`)}
function saveCred(id){const r=S.routers.find(x=>x.id===id);r.user=$('#cu').value.trim();r.pass=$('#cp').value;save();closeM();render();toast('সেভ হয়েছে')}
function go(t){tab=t;render();scrollTo(0,0)}

/* ---------- views ---------- */
function pillOf(r){return r.online===null?'<span class="pill"><i></i>চেক হচ্ছে</span>':r.online?'<span class="pill ok"><i></i>অনলাইন</span>':'<span class="pill bad"><i></i>পৌঁছানো যাচ্ছে না</span>'}
function vHome(r){
 const n=r.devices.length,bl=r.devices.filter(d=>d.blocked).length,lm=r.devices.filter(d=>d.limit).length;
 const all=CAT.flatMap(c=>c[1]).map(a=>a[0]),nb=all.filter(k=>r.blocks[k]).length+r.custom.length,vp=r.vpns.find(v=>v.on);
 const dots=r.devices.map((d,i)=>{const a=i*2.399,q=24+(i*37)%22;return `<i class="nd ${d.blocked?'bk':d.limit?'lm':''}" style="left:${50+q*Math.cos(a)}%;top:${50+q*Math.sin(a)}%;animation-delay:${(i%7)*.4}s"></i>`}).join('');
 return `<div class="hero ${r.paused?'off':''}"><div class="row" style="position:relative"><div class="sp"><div class="nm" style="font-size:22px">${esc(r.name)}</div><div class="ds">${esc(r.ip)}</div></div>${pillOf(r)}</div>
 <div class="radar"><i class="rg" style="inset:0"></i><i class="rg" style="inset:17%"></i><i class="rg" style="inset:34%"></i><div class="sweep"></div>${dots}<div class="core"><b>${n}</b><span>ডিভাইস</span></div></div>
 <div class="lg"><span><i class="nd"></i>সক্রিয়</span><span><i class="nd bk"></i>ব্লকড</span><span><i class="nd lm"></i>লিমিট</span></div>
 <button class="btn sm ${r.paused?'rd':'gh'}" style="width:100%" onclick="setPaused()">${r.paused?'⏵ ইন্টারনেট চালু করুন':'⏸ সব ইন্টারনেট বন্ধ'}</button></div>
 <div class="grid"><div class="st"><b>${n-bl}</b><span>সক্রিয়</span></div><div class="st"><b style="color:var(--r)">${bl}</b><span>ব্লকড ডিভাইস</span></div>
 <div class="st"><b style="color:var(--w)">${lm}</b><span>স্পিড লিমিট</span></div><div class="st"><b style="color:var(--a)">${nb}</b><span>ব্লকড অ্যাপ/সাইট</span></div></div>
 <div class="sec">দ্রুত ব্লক</div><div class="chips">${QUICK.map(q=>`<button class="chip ${r.blocks[q[0]]?'on':''}" onclick="setBlock('${q[0]}')">${q[1]}</button>`).join('')}</div>
 <div class="card row" onclick="go('vpn')"><div class="ic">🔐</div><div class="sp"><div class="nm">ভিপিএন</div><div class="ds">${vp?esc(vp.name)+' সংযুক্ত':'সংযুক্ত নেই'}</div></div><span class="pill ${vp?'ok':''}"><i></i>${vp?'চালু':'বন্ধ'}</span></div>`}
function vDev(r){return `<div class="row" style="margin-bottom:6px"><div class="sp"><h2>ডিভাইস</h2><p class="sub" style="margin:0">ব্লক ও স্পিড লিমিট</p></div><button class="fab" onclick="devForm()">+</button></div>
 <div style="height:12px"></div>`+(r.devices.length?r.devices.map(d=>`<div class="card"><div class="row"><div class="ic">📱</div><div class="sp"><div class="nm">${esc(d.name)}</div><div class="ds">${esc((d.ip?d.ip+" · ":"")+d.addr)}</div></div>
 <span class="ds">${d.blocked?'ব্লকড':'ব্লক'}</span>${sw(d.blocked,`devBlock('${d.id}')`,1)}</div>
 <div class="row" style="margin-top:12px"><select onchange="devLimit('${d.id}',this.value)">${[[0,'ইন্টারনেট লিমিট নেই'],[1,'১ Mbps'],[2,'২ Mbps'],[5,'৫ Mbps'],[10,'১০ Mbps']].map(o=>`<option value="${o[0]}" ${d.limit==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
 <button class="btn rd sm" onclick="delDev('${d.id}')">মুছুন</button></div></div>`).join(''):`<div class="empty"><big>📱</big>কোনো ডিভাইস নেই<br><span class="ds">+ চেপে মোবাইল যোগ করুন</span></div>`)}
function devForm(){modal(`<h3>নতুন ডিভাইস</h3><label>নাম</label><input id="dn" placeholder="যেমন: রাফির মোবাইল"><label>MAC বা IP</label><input id="dm" placeholder="AA:BB:CC:11:22:33" autocapitalize="off"><div style="height:18px"></div><button class="btn" onclick="addDev()">যোগ করুন</button>`)}
function vBlock(r){return `<h2>কন্টেন্ট ব্লক</h2><p class="sub">অ্যাপ ও সাইট একটা টাচে বন্ধ</p>`+CAT.map(c=>`<div class="sec">${c[0]}</div><div class="card list" style="padding:6px 14px">${c[1].map(a=>`<div class="row"><div class="ic">${a[2]}</div><div class="sp nm">${a[1]}</div>${sw(r.blocks[a[0]],`setBlock('${a[0]}')`,1)}</div>`).join('')}</div>`).join('')+
 `<div class="sec">নিজের সাইট ব্লক</div><div class="card"><div class="row"><input id="cd" placeholder="example.com" autocapitalize="off"><button class="fab" onclick="addCustom()">+</button></div>
 <div class="chips" style="flex-wrap:wrap;margin:12px 0 0">${r.custom.map(v=>`<button class="chip on" onclick="delCustom('${esc(v)}')">${esc(v)} ✕</button>`).join('')}</div></div>`}
function vVpn(r){const vp=r.vpns.find(v=>v.on);
 return `<div class="row"><div class="sp"><h2>ভিপিএন</h2><p class="sub" style="margin:0">কানেক্ট ও নিয়ন্ত্রণ</p></div><button class="fab" onclick="vpnForm()">+</button></div><div style="height:12px"></div>
 <div class="hero"><div class="row" style="position:relative"><div class="ic" style="width:54px;height:54px;font-size:26px">${vp?'🔒':'🔓'}</div><div class="sp"><div class="nm" style="font-size:18px">${vp?esc(vp.name):'সংযুক্ত নেই'}</div><div class="ds">${vp?esc(vp.server):'একটি প্রোফাইল চালু করুন'}</div></div></div></div>
 <div class="card row"><div class="ic">🚷</div><div class="sp"><div class="nm">ডিভাইসে ভিপিএন ব্লক</div><div class="ds">ভিপিএন দিয়ে ব্লক এড়ানো বন্ধ</div></div>${sw(r.vpnBlock,'vpnBlock()')}</div>
 <div class="sec">প্রোফাইল</div>`+(r.vpns.length?`<div class="card list" style="padding:6px 14px">${r.vpns.map(v=>`<div class="row"><div class="ic">🔐</div><div class="sp"><div class="nm">${esc(v.name)}</div><div class="ds">${esc(v.server)}</div></div><button class="ds" onclick="delVpn('${v.id}')">✕</button>${sw(v.on,`vpnOn('${v.id}')`)}</div>`).join('')}</div>`:`<div class="empty"><big>🔐</big>কোনো ভিপিএন প্রোফাইল নেই</div>`)}
function vpnForm(){modal(`<h3>ভিপিএন প্রোফাইল</h3><label>নাম</label><input id="vn" placeholder="যেমন: অফিস ভিপিএন"><label>সার্ভার</label><input id="vs" placeholder="vpn.example.com" autocapitalize="off"><div style="height:18px"></div><button class="btn" onclick="addVpn()">যোগ করুন</button>`)}
function vRouters(){return `<div class="row"><div class="sp"><h2>রাউটার</h2><p class="sub" style="margin:0">যেকোনো রাউটার যোগ করুন</p></div><button class="fab" style="margin-right:8px" onclick="findMore()">⟳</button><button class="fab" onclick="modal('<h3>নতুন রাউটার</h3>'+routerForm(0))">+</button></div><div style="height:12px"></div>`+
 S.routers.map(r=>`<div class="card"><div class="row"><div class="ic">📡</div><div class="sp"><div class="nm">${esc(r.name)}</div><div class="ds">${esc(r.ip)}${r.user?' · '+esc(r.user):''}</div></div>${pillOf(r)}</div>
 <div class="row" style="margin-top:12px"><button class="btn gh sm" style="flex:1" onclick="credForm('${r.id}')">${r.pass?'লগইন ✓':'লগইন'}</button><button class="btn gh sm" style="flex:1" onclick="test('${r.id}')">টেস্ট</button>
 ${r.id===S.active?'<span class="pill ok" style="flex:1;justify-content:center"><i></i>সক্রিয়</span>':`<button class="btn sm" style="flex:1" onclick="setActive('${r.id}')">ব্যবহার করুন</button>`}
 <button class="btn rd sm" onclick="delRouter('${r.id}')">মুছুন</button></div></div>`).join('')}

function render(){const r=cur(),root=$('#root');
 if(!r){root.innerHTML=searchView();if(!searching&&!failed)autoAdd();return}
 const V={home:vHome,dev:vDev,block:vBlock,vpn:vVpn,router:vRouters}[tab](r);
 const N=[['home','🏠','হোম'],['dev','📱','ডিভাইস'],['block','🚫','ব্লক'],['vpn','🔐','ভিপিএন'],['router','📡','রাউটার']];
 root.innerHTML=`<div class="app"><div class="top"><div class="brand"><div class="dot">⚡</div>NetGuard</div>${tab==='home'?pillOf(r):''}</div>${V}</div>
 <div class="nav">${N.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div>`}
render();
</script></body></html>
